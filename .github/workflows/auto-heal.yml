name: Auto Heal Failed Runs

# GitHub-side infrastructure flakes ("The job was not acquired by Runner of
# type hosted even after multiple attempts", startup errors) fail a run before
# a single step of ours executes. Those failures self-resolve once GitHub's
# runner pool recovers — so re-run them automatically instead of leaving a
# gap in monitoring until someone clicks Re-run by hand.
#
# Genuine failures (a step of ours ran and exited non-zero) are NOT retried:
# they signal a real problem that a blind re-run would only repeat.

on:
  workflow_run:
    workflows: ["Uptime Monitor", "Deploy Status Page"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run infra-failed jobs
    # Only first attempts: one automatic retry per run. If the retry fails
    # too, the next scheduled run covers the gap — endless retry loops would
    # just multiply failure notifications during a long platform outage.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run if the failure was infrastructure-level
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = context.payload.workflow_run.id;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              filter: 'latest',
            });

            const bad = jobs.filter(j => j.conclusion !== 'success' && j.conclusion !== 'skipped');

            // Infra failure signature: the job was cancelled/failed without ever
            // being picked up by a runner (runner_name empty) or without any of
            // its steps completing. If ANY failed job actually executed steps,
            // it's a real failure — leave it for a human.
            const infraOnly = bad.length > 0 && bad.every(j =>
              !j.runner_name ||
              !(j.steps || []).some(s => s.status === 'completed' && s.conclusion !== null)
            );

            if (!infraOnly) {
              core.info(`Run ${runId}: failure came from our own steps — not retrying.`);
              return;
            }

            core.info(`Run ${runId}: jobs never acquired a runner — re-running failed jobs.`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
